<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse Wholesome Bakes gluten-free product gallery — cookies, cakes, breads and more from St. Augustine, FL.">
  <title>Wholesome Bakes | Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <button class="menu-toggle" type="button" aria-label="Open menu">☰</button>

  <div class="site-wrapper">
    <aside class="sidebar">
      <a href="index.html" class="sidebar-logo">
        <span class="sidebar-logo-ring">
          <img src="Assets/Logo_nobg.png" alt="Wholesome Bakes logo">
        </span>
      </a>
      <nav aria-label="Main navigation">
        <ul class="sidebar-nav">
          <li><a href="index.html">Home</a></li>
          <li><a href="gallery.html" class="active">Gallery</a></li>
          <li><a href="about.html">About</a></li>
        </ul>
      </nav>
      <div class="sidebar-social">
        <a class="btn-social-sidebar" href="https://instagram.com" target="_blank" rel="noopener noreferrer">Instagram</a>
        <a class="btn-social-sidebar" href="https://facebook.com" target="_blank" rel="noopener noreferrer">Facebook</a>
      </div>
      <p class="sidebar-footer">St. Augustine, Florida</p>
    </aside>

    <main class="main-content">
      <section class="section content-centered">
        <header class="page-header animate-in">
          <h1>Product Gallery</h1>
          <p class="lead">A taste of what we bake — every item is gluten-free and made with care in St. Augustine, Florida.</p>
          <p class="usp">Gluten Free Products that are actually delicious</p>
        </header>

        <div class="slideshow animate-in" id="product-slideshow">
          <div class="slideshow-main-wrap">
            <button type="button" class="slideshow-arrow" id="slideshow-prev" aria-label="Previous image">‹</button>
            <figure class="slideshow-main">
              <img id="slideshow-current-img" src="Assets/Product%20Images/1.jpg" alt="Wholesome Bakes product">
            </figure>
            <button type="button" class="slideshow-arrow" id="slideshow-next" aria-label="Next image">›</button>
          </div>

          <div class="slideshow-dock" aria-label="Gallery navigation">
            <button type="button" class="slideshow-dock-item is-prev" id="dock-prev">
              <span class="dock-thumb"><img src="" alt=""></span>
              <span class="dock-label">Previous</span>
            </button>
            <button type="button" class="slideshow-dock-item is-current" id="dock-current" aria-current="true">
              <span class="dock-thumb"><img src="" alt=""></span>
              <span class="dock-label">Now</span>
            </button>
            <button type="button" class="slideshow-dock-item is-next" id="dock-next">
              <span class="dock-thumb"><img src="" alt=""></span>
              <span class="dock-label">Next</span>
            </button>
          </div>

          <p class="slideshow-counter"><span id="slideshow-index">1</span> / 20</p>
        </div>

        <p class="animate-in" style="margin-top: 2.5rem;">
          <a class="btn btn-cta" href="mailto:hello@wholesomebakes.com?subject=Gallery%20Product%20Inquiry">Ask About an Item</a>
        </p>
      </section>
    </main>
  </div>

  <script src="js/main.js"></script>
  <script src="js/gallery.js"></script>
</body>
</html>
