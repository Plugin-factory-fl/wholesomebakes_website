<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse the Wholesome Bakes gluten-free product catalogue and build your order in St. Augustine, Florida.">
  <title>Wholesome Bakes | Catalogue</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <button class="menu-toggle" type="button" aria-label="Open menu">☰</button>

  <div class="site-wrapper">
    <aside class="sidebar">
      <a href="index.html" class="sidebar-logo">
        <span class="sidebar-logo-ring">
          <img src="Assets/Logo_nobg.png" alt="Wholesome Bakes logo">
        </span>
      </a>
      <nav aria-label="Main navigation">
        <ul class="sidebar-nav">
          <li><a href="index.html">Home</a></li>
          <li><a href="catalogue.html" class="active">Catalogue</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="checkout.html" class="sidebar-cart-link">Cart <span class="cart-badge" data-cart-count hidden>0</span></a></li>
        </ul>
      </nav>
      <div class="sidebar-social">
        <a class="btn-social-sidebar" href="https://instagram.com" target="_blank" rel="noopener noreferrer">Instagram</a>
        <a class="btn-social-sidebar" href="https://facebook.com" target="_blank" rel="noopener noreferrer">Facebook</a>
      </div>
      <p class="sidebar-footer">St. Augustine, Florida</p>
    </aside>

    <main class="main-content">
      <section class="section content-centered">
        <header class="page-header animate-in">
          <h1>Product Catalogue</h1>
          <p class="lead">Build your order from our gluten-free lineup — add items to your cart, then checkout when you're ready.</p>
          <p class="usp">Gluten Free Products that are actually delicious</p>
        </header>

        <div class="catalogue-toolbar animate-in">
          <a href="checkout.html" class="btn btn-cta">Checkout <span class="cart-badge cart-badge--inline" data-cart-count hidden>0</span></a>
        </div>

        <div id="catalogue-grid" class="catalogue-grid animate-in"></div>
      </section>
    </main>
  </div>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/catalogue.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
